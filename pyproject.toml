[project]
name = "atact"
version = "0.1.0"
description = "Affective Tactility: reconstructed generator and checks (not the original code)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
