[project]
name = "atact"
version = "0.1.0"
description = "A generative rule from affect to tactile relief: reconstructed generator, descriptors and checks"
authors = [{ name = "Mikoto Miura" }, { name = "Yuusuke Harada" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "scikit-image>=0.26.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
